# One unprivileged satellite, same shape as basanos/themis.
# Default `docker compose up` is stub-only: tenants are loopback subprocesses
# *inside* this box. The box cannot drive the host — no docker CLI, no sock,
# no privileged, no host pid/ipc/uts/net, no bind of /.
# Nested privileged DinD is not shipped. Docker runtime is a *host process*
# (`python -m hestia` on a machine that already has Docker), not this container.
# Ledger default is SQLite under /data. Production overlay:
# docker compose -f docker-compose.yml -f docker-compose.postgres.yml up

services:
  hestia:
    build: .
    ports:
      - "127.0.0.1:9480:9480"
    environment:
      HESTIA_HOST: "0.0.0.0"
      HESTIA_PUBLIC_BASE: "${HESTIA_PUBLIC_BASE:-http://127.0.0.1:9480}"
      HESTIA_DATA_DIR: /data
      HESTIA_DEPLOY_TOKEN: "${HESTIA_DEPLOY_TOKEN:?set HESTIA_DEPLOY_TOKEN}"
      # stub (default): handlers run as AST-admitted processes in this box. wasm: they run in
      # the WebAssembly sandbox of the hestia-runner service below (`--profile wasm`).
      HESTIA_RUNTIME: "${HESTIA_RUNTIME:-stub}"
      HESTIA_RUNNER_SOCKET: /run/hestia-runner/runner.sock
      # wasm only: owners who admitted themselves may deploy code (it runs in the sandbox).
      HESTIA_OPEN_OWNER_CODE: "${HESTIA_OPEN_OWNER_CODE:-0}"
      # A key admits itself for free, so their agents share ONE lane: at most this many of the
      # runner's slots, one call per owner, so the operator's agents always keep a slot. The
      # hearth refuses to start unless it stays below the runner's workers (same variable).
      HESTIA_RUNNER_WORKERS: "${HESTIA_RUNNER_WORKERS:-2}"
      HESTIA_OPEN_LANE_SLOTS: "${HESTIA_OPEN_LANE_SLOTS:-1}"
      HESTIA_OPEN_LANE_WAIT_S: "${HESTIA_OPEN_LANE_WAIT_S:-2}"
      HESTIA_DATABASE_URL: "${HESTIA_DATABASE_URL:-}"
      HESTIA_ALLOW_HOST_DOCKER: "0"
      # Hybrid Ed25519 + ML-DSA-65. A hub with AIMARKET_PQC_REQUIRE=1 refuses a
      # classic-only manifest/receipt; the ML-DSA key is /data/provider.key_mldsa.
      HESTIA_PQC: "${HESTIA_PQC:-1}"
      HESTIA_MAX_TENANTS: "${HESTIA_MAX_TENANTS:-8}"
      HESTIA_OWNER_MAX_TENANTS: "${HESTIA_OWNER_MAX_TENANTS:-3}"
      HESTIA_OPEN_OWNERS: "${HESTIA_OPEN_OWNERS:-0}"
      # Name prefixes no owner may deploy under (empty: aicom,aimarket,modelmarket; hestia always).
      HESTIA_RESERVED_PREFIXES: "${HESTIA_RESERVED_PREFIXES:-}"
      HESTIA_TENANT_HUB_KEYS: "${HESTIA_TENANT_HUB_KEYS:-}"
      # Wall-clock budget for one invoke, enforced inside each agent process.
      HESTIA_TENANT_CALL_TIMEOUT_S: "${HESTIA_TENANT_CALL_TIMEOUT_S:-10}"
      # Address-space ceiling per agent process (MiB). 0 disables it.
      HESTIA_STUB_MEMORY_CAP_MB: "${HESTIA_STUB_MEMORY_CAP_MB:-512}"
      # Off by default. On, the hearth verifies a USDC transfer to each tenant's
      # own payout address before serving a priced call — it holds no funds and
      # takes no cut, so there is nothing here to custody.
      HESTIA_PAYMENTS_ENABLED: "${HESTIA_PAYMENTS_ENABLED:-0}"
      HESTIA_PAYMENT_CHAIN: "${HESTIA_PAYMENT_CHAIN:-base}"
      HESTIA_PAYMENT_TOKEN: "${HESTIA_PAYMENT_TOKEN:-USDC}"
      HESTIA_PAYMENT_TOKEN_CONTRACT: "${HESTIA_PAYMENT_TOKEN_CONTRACT:-0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913}"
      HESTIA_PAYMENT_RPC_URL: "${HESTIA_PAYMENT_RPC_URL:-}"
      HESTIA_PAYMENT_MIN_CONFIRMATIONS: "${HESTIA_PAYMENT_MIN_CONFIRMATIONS:-1}"
      # A bare transfer names no call, so a transfer made for something else
      # could settle one. On (the default), a payment must carry the EIP-3009
      # authorization for the nonce this hearth minted in its 402. Off is only
      # safe when the payout address is dedicated to this hearth.
      HESTIA_PAYMENT_INVOICE_TTL_S: "${HESTIA_PAYMENT_INVOICE_TTL_S:-900}"
      HESTIA_PAYMENT_MAX_AGE_S: "${HESTIA_PAYMENT_MAX_AGE_S:-3600}"
      # The EIP-712 domain buyers sign against, published in the 402 so their
      # tooling never guesses it. Defaults are USDC on Base.
      HESTIA_PAYMENT_CHAIN_ID: "${HESTIA_PAYMENT_CHAIN_ID:-8453}"
      HESTIA_PAYMENT_TOKEN_EIP712_NAME: "${HESTIA_PAYMENT_TOKEN_EIP712_NAME:-USD Coin}"
      HESTIA_PAYMENT_TOKEN_EIP712_VERSION: "${HESTIA_PAYMENT_TOKEN_EIP712_VERSION:-2}"
      # Verified compute (docs/COMPUTE.md). Off by default. Each replica is a
      # subprocess inside this box, so MAX_CONCURRENT x MEMORY_MB must leave room
      # in mem_limit below for the plane and its agents.
      HESTIA_COMPUTE_ENABLED: "${HESTIA_COMPUTE_ENABLED:-0}"
      HESTIA_COMPUTE_FUNCTIONS: "${HESTIA_COMPUTE_FUNCTIONS:-}"
      HESTIA_COMPUTE_PAYOUT_ADDRESS: "${HESTIA_COMPUTE_PAYOUT_ADDRESS:-}"
      HESTIA_COMPUTE_HUB_KEYS: "${HESTIA_COMPUTE_HUB_KEYS:-}"
      HESTIA_COMPUTE_CPU_MS: "${HESTIA_COMPUTE_CPU_MS:-2000}"
      HESTIA_COMPUTE_MEMORY_MB: "${HESTIA_COMPUTE_MEMORY_MB:-256}"
      HESTIA_COMPUTE_WALL_S: "${HESTIA_COMPUTE_WALL_S:-5}"
      HESTIA_COMPUTE_MAX_CONCURRENT: "${HESTIA_COMPUTE_MAX_CONCURRENT:-2}"
      HESTIA_COMPUTE_RUN_PRICE_USD: "${HESTIA_COMPUTE_RUN_PRICE_USD:-0.001}"
      HESTIA_COMPUTE_VERIFY_PRICE_USD: "${HESTIA_COMPUTE_VERIFY_PRICE_USD:-0.0025}"
    user: "65532:65532"
    privileged: false
    read_only: true
    # The box that runs agent processes had no ceiling of its own: a runaway
    # handler could take the whole host, which also carries the Hub and Postgres.
    # Per-agent rlimits bound one agent; these bound all of them together.
    mem_limit: "${HESTIA_MEM_LIMIT:-1g}"
    pids_limit: ${HESTIA_PIDS_LIMIT:-256}
    # The host carries other services; a CPU ceiling keeps the plane (and, under the stub
    # runtime, its agent processes) from taking all of it.
    cpus: ${HESTIA_CPUS:-2}
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - hestia-data:/data
      - hestia-runner-sock:/run/hestia-runner
    restart: unless-stopped

  # The sandbox runner (HESTIA_RUNTIME=wasm). Executes template handlers in CPython-for-WASI
  # under wasmtime, one fresh instance per call. It has NO network at all, NO secrets (none
  # of the hearth's environment is passed), a read-only filesystem, and one Unix socket in a
  # volume it shares with the hearth. Even a wasmtime escape would land here, with nothing
  # to read and nowhere to send it.
  hestia-runner:
    build: .
    profiles: ["wasm"]
    command: ["python", "-m", "hestia.wasm_runner"]
    network_mode: none
    environment:
      HESTIA_RUNNER_SOCKET: /run/hestia-runner/runner.sock
      HESTIA_WASM_ROOT: /opt/python-wasi
      HESTIA_RUNNER_WORKERS: "${HESTIA_RUNNER_WORKERS:-2}"
      HESTIA_RUNNER_MEMORY_MB: "${HESTIA_RUNNER_MEMORY_MB:-256}"
      HESTIA_TENANT_CALL_TIMEOUT_S: "${HESTIA_TENANT_CALL_TIMEOUT_S:-10}"
    user: "65532:65532"
    privileged: false
    read_only: true
    mem_limit: "${HESTIA_RUNNER_MEM_LIMIT:-1g}"
    pids_limit: 64
    # Each call may spin until its deadline, so without this a few busy handlers take whole
    # cores of a host that also runs other services. Memory had a ceiling; CPU had none.
    cpus: ${HESTIA_RUNNER_CPUS:-1.5}
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - hestia-runner-sock:/run/hestia-runner
    healthcheck:
      test: ["CMD", "python", "-m", "hestia.wasm_runner", "--probe"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

volumes:
  hestia-data:
  hestia-runner-sock:
