# aimarket-hestia. Unprefixed short names on PyPI are claimable by strangers
# (see oracles/core/pyproject.toml). Distribution name is always aimarket-*.
[project]
name = "aimarket-hestia"
version = "0.1.0"
description = "HESTIA — the hearth: isolated hosted runtime for AIMarket capability providers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "cryptography>=44",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.10",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.12,<1",
]

[project.urls]
Documentation = "https://github.com/alexar76/hestia#readme"
Issues = "https://github.com/alexar76/hestia/issues"
Repository = "https://github.com/alexar76/hestia"
Homepage = "https://alexar76.github.io/hestia/"

[project.scripts]
hestia = "hestia.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hestia"]

[tool.hatch.build.targets.sdist]
include = [
    "/hestia",
    "/console",
    "/tests",
    "/docs",
    "/README.md",
    "/SECURITY.md",
    "/LICENSE",
    "/Dockerfile",
    "/.dockerignore",
    "/.env.example",
    "/Makefile",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=hestia --cov-branch --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
